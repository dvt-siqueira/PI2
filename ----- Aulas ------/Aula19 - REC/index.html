<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Search — Recuperação PI2</title>
  <!-- CDN Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div>
    <h2>🔎 Buscador Pokédex</h2>

    <!-- Formulário de Busca -->
    <div>
      <form id="form-busca">
        <div>
          <input type="text" id="pokemon-input" placeholder="Nome ou ID (ex: pikachu)" required>
        </div>
        <div>
          <button type="submit">Buscar</button>
        </div>
      </form>
      <!-- Div para Mensagens de Status/Erro -->
      <div id="status-msg"></div>
    </div>

    <!-- Card do Pokémon (Inicia OCULTO via d-none) -->
    <div id="pokemon-card" class="d-none">
      <img id="poke-img" src="" alt="Sprite do Pokémon">
      <div>
        <h4 id="poke-name"></h4>
        
        <!-- Contêiner dos Tipos (Badges) -->
        <div id="poke-types"></div>

        <!-- Estatísticas Básicas -->
        <ul>
          <li>
            <strong>HP:</strong> <span id="stat-hp">0</span>
          </li>
          <li>
            <strong>Ataque:</strong> <span id="stat-attack">0</span>
          </li>
          <li>
            <strong>Defesa:</strong> <span id="stat-defense">0</span>
          </li>
        </ul>
      </div>
    </div>

  </div>

  <!-- Script da Aplicação -->
  <script src="script.js"></script>
</body>
</html>
