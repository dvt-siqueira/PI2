<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Teste</title>
    <meta charset="UTF-8">
</head>

<body>
    <h1>Teste</h1>
    <input type="text" id="item-nome" placeholder="Nome do item">
    <button id="btn-add">Adicionar à Lista</button>
    <ul id="lista-visual"></ul>
</body>
<script>
    const inputNome = document.getElementById('item-nome');
    const btnAdd = document.getElementById('btn-add');
    const listaVisual = document.getElementById('lista-visual');
    let minhaLista = [];

    btnAdd.addEventListener('click', () => {
        if (inputNome !== '') {
            minhaLista.push(inputNome.value);
        }
        inputNome.value = '';
        console.log(minhaLista);
    });

</script>

</html>
