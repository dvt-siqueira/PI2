<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Endereço - ViaCEP</title>
    <!-- CSS do Bootstrap 5 via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-4">
        <h3 class="card-title text-center mb-4">
          Consulta de Endereço via CEP
        </h3>

        <form id="form-endereco">
          <div class="row g-3">
            <!-- Campo CEP -->
            <div class="col-md-4">
              <label for="cep" class="form-label">CEP</label>
              <input
                type="text"
                class="form-control"
                id="cep"
                placeholder="00000-000"
                maxlength="9"
              />
              <div id="mensagem" class="form-text text-danger mt-1"></div>
            </div>

            <!-- Campo Logradouro -->
            <div class="col-md-8">
              <label for="logradouro" class="form-label"
                >Logradouro / Rua</label
              >
              <input
                type="text"
                class="form-control"
                id="logradouro"
                readonly
              />
            </div>

            <!-- Campo Bairro -->
            <div class="col-md-5">
              <label for="bairro" class="form-label">Bairro</label>
              <input type="text" class="form-control" id="bairro" readonly />
            </div>

            <!-- Campo Cidade -->
            <div class="col-md-5">
              <label for="localidade" class="form-label">Cidade</label>
              <input
                type="text"
                class="form-control"
                id="localidade"
                readonly
              />
            </div>

            <!-- Campo UF -->
            <div class="col-md-2">
              <label for="uf" class="form-label">UF</label>
              <input type="text" class="form-control" id="uf" readonly />
            </div>
            <!-- Adicionar dentro da <div class="row g-3"> -->
            <div class="col-md-3">
              <label for="numero" class="form-label">Número</label>
              <input type="text" class="form-control" id="numero" />
            </div>

            <div class="col-md-9">
              <label for="complemento" class="form-label">Complemento</label>
              <input
                type="text"
                class="form-control"
                id="complemento"
                placeholder="Apt, Bloco, etc."
              />
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- JS do Bootstrap e Script da Aplicação -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
